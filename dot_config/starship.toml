[directory]
truncation_length = 4
truncation_symbol = '…/'

[character]
success_symbol = '[➜](bold green) '
error_symbol = '[✗](bold red) '

[hostname]
ssh_only = false
format = '[$ssh_symbol](bold blue) on [$hostname](bold red) '
trim_at = '.companyname.com'
disabled = false

[jobs]
symbol = '✦ '
number_threshold = 2
symbol_threshold = 1
disabled = false

[username]
disabled = false
show_always = true
format = "[$user]($style) "
style_user = "bold blue"
style_root = "bold red"

[os]
# format = "on [($name )]($style)"
format = "on [$symbol($name )$symbol]($style)"
style = "bold blue"
disabled = false

[sudo]
style = 'bold green'
# symbol = '👩‍💻 '
symbol = '👷'
disabled = false
